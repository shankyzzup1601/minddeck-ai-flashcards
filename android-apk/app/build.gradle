plugins {
    id "com.android.application"
}

android {
    namespace "com.minddeck.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.minddeck.app"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.3.1"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("MINDDECK_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("MINDDECK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MINDDECK_KEY_ALIAS")
                keyPassword System.getenv("MINDDECK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.2"
    implementation "androidx.core:core:1.16.0"
}
