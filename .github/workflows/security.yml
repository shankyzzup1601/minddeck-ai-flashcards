name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit==2.9.0 bandit==1.9.4
      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q app.py tests scripts
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/smart-study.js
          node --check static/sw.js
          node --check static/offline.js
      - name: Test browser study utilities
        run: node tests/smart-study.test.mjs
      - name: Scan Python for security issues
        run: python -m bandit -q -r app.py scripts
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
