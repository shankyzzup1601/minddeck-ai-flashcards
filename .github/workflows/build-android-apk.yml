name: Build MindDeck Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable APK
        run: gradle -p android-apk --no-daemon assembleRelease

      - name: Prepare and verify download
        run: |
          cp android-apk/app/build/outputs/apk/release/app-release.apk MindDeck.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose MindDeck.apk

      - name: Publish direct MindDeck download
        run: |
          cp MindDeck.apk static/MindDeck.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/MindDeck.apk
          git commit -m "Publish MindDeck Android v1.3.0"
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindDeck-Android-v1.3.0
          path: MindDeck.apk
          retention-days: 90

      - name: Publish release backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create minddeck-android-v1.3.0 MindDeck.apk \
            --title "MindDeck Android v1.3.0" \
            --notes "Native Android focus-timer notification, direct APK download, and refreshed MindDeck experience." \
            --latest
