name: Build MindDeck Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and lint Android startup changes
        run: |
          gradle -p android-apk --no-daemon assembleDebug lintDebug || {
            cat android-apk/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }
      - name: Require permanent release signing
        env:
          KEYSTORE: ${{ secrets.MINDDECK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MINDDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINDDECK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINDDECK_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure the four MINDDECK release signing secrets. No APK has been published."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/minddeck-release.jks"
      - name: Build signed release
        env:
          MINDDECK_KEYSTORE_PATH: ${{ runner.temp }}/minddeck-release.jks
          MINDDECK_KEYSTORE_PASSWORD: ${{ secrets.MINDDECK_KEYSTORE_PASSWORD }}
          MINDDECK_KEY_ALIAS: ${{ secrets.MINDDECK_KEY_ALIAS }}
          MINDDECK_KEY_PASSWORD: ${{ secrets.MINDDECK_KEY_PASSWORD }}
        run: gradle -p android-apk --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          cp android-apk/app/build/outputs/apk/release/app-release.apk MindDeck-Android-1.3.1.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs MindDeck-Android-1.3.1.apk
          sha256sum MindDeck-Android-1.3.1.apk
      - name: Save release candidate for verification
        uses: actions/upload-artifact@v4
        with:
          name: MindDeck-Android-1.3.1-release-candidate
          path: MindDeck-Android-1.3.1.apk
          retention-days: 90
