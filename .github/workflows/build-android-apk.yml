name: Build MindDeck Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable APK
        run: gradle -p android-apk --no-daemon assembleRelease

      - name: Prepare download
        run: cp android-apk/app/build/outputs/apk/release/app-release.apk MindDeck.apk

      - name: Verify APK signature
        run: "${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose MindDeck.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindDeck-Android
          path: MindDeck.apk
          retention-days: 90

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create minddeck-android-v1.0.0 MindDeck.apk \
            --title "MindDeck Android v1.0.0" \
            --notes "Installable Android APK for MindDeck. Google sign-in runs through Chrome's trusted browser flow." \
            --latest
