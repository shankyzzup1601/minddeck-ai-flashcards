name: Publish MindDeck installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble Android APK
        run: gradle -p android :app:assembleDebug
      - name: Name Android installer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MindDeck.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: MindDeck.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-package-lock
      - name: Package Windows installer
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error

  publish-installers:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/android-apk-wrapper
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish direct Android file
        run: |
          mkdir -p downloads
          cp release/android-installer/MindDeck.apk downloads/MindDeck.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MindDeck.apk
          git diff --cached --quiet || git commit -m "Publish MindDeck Android installer"
          git push origin HEAD:codex/android-apk-wrapper
      - name: Publish direct installer downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minddeck-v1.0.0
          name: MindDeck AI v1.0.0
          prerelease: true
          target_commitish: codex/android-apk-wrapper
          files: |
            release/android-installer/MindDeck.apk
            release/windows-installer/MindDeck-AI-Setup-1.0.0.exe
          overwrite_files: true
