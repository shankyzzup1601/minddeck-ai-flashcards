name: Publish free APK download site

on:
  push:
    branches: [main]
    paths:
      - "apk-download-site/**"
      - ".github/workflows/deploy-apk-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apk-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify complete signed APK
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shankyzzup1601/minddeck-ai-flashcards/releases/download/minddeck-android-v1.2.0/MindDeck.apk \
            -o apk-download-site/MindDeck.apk
          test "$(stat -c%s apk-download-site/MindDeck.apk)" -eq 3676255
          echo "a0467a6b55da182d1abb0bc1aa360d4577ae6f7f5d196259457c9ef3fef6aa14  apk-download-site/MindDeck.apk" | sha256sum -c -
      - name: Publish APK on the MindDeck domain
        run: |
          cp apk-download-site/MindDeck.apk static/MindDeck.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/MindDeck.apk
          git diff --cached --quiet || git commit -m "Host verified APK directly on MindDeck"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apk-download-site
      - id: deployment
        uses: actions/deploy-pages@v4
