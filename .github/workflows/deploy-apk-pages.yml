name: Publish free APK download site

on:
  push:
    branches: [main]
    paths:
      - "apk-download-site/**"
      - ".github/workflows/deploy-apk-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apk-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify complete signed APK
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shankyzzup1601/minddeck-ai-flashcards/releases/download/minddeck-android-v1.1.0/MindDeck.apk \
            -o apk-download-site/MindDeck.apk
          test "$(stat -c%s apk-download-site/MindDeck.apk)" -eq 3676243
          echo "afce9158701e6eb33429141aa81e1f4806c2757cb1d66282ae049edb46b39007  apk-download-site/MindDeck.apk" | sha256sum -c -
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apk-download-site
      - id: deployment
        uses: actions/deploy-pages@v4
