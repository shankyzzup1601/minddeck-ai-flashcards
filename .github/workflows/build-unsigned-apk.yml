name: Build unsigned MindDeck APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unsigned-apk.yml'
      - 'scripts/unsigned-apk.gradle'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned release without changing normal signing
        run: gradle -p android-apk --init-script "$GITHUB_WORKSPACE/scripts/unsigned-apk.gradle" --no-daemon assembleRelease
      - name: Check unsigned artifact
        run: |
          test -s android-apk/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t android-apk/app/build/outputs/apk/release/app-release-unsigned.apk
          if "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify android-apk/app/build/outputs/apk/release/app-release-unsigned.apk; then
            echo 'Unexpected signed APK'; exit 1
          fi
          cp android-apk/app/build/outputs/apk/release/app-release-unsigned.apk MindDeck-1.3.0-unsigned.apk
          sha256sum MindDeck-1.3.0-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MindDeck-1.3.0-unsigned
          path: MindDeck-1.3.0-unsigned.apk
          if-no-files-found: error
          retention-days: 90
