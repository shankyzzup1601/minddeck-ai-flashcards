name: Build signed MindDeck Native candidate

on:
  workflow_dispatch:
  push:
    branches: ['native/android-v1']
    paths: ['.github/workflows/publish-native-android.yml']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require established permanent signing credentials
        env:
          KEYSTORE: ${{ secrets.MINDDECK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MINDDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINDDECK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINDDECK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/minddeck-release.jks"
      - name: Build unsigned native release
        run: gradle -p native-android --no-daemon assembleRelease
      - name: Sign and verify native package
        env:
          STORE_PASSWORD: ${{ secrets.MINDDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINDDECK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINDDECK_KEY_PASSWORD }}
        run: |
          UNSIGNED=native-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -f 4 "$UNSIGNED" MindDeck-Native-aligned.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/minddeck-release.jks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out MindDeck-Native.apk MindDeck-Native-aligned.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs MindDeck-Native.apk | tee native-signer.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging MindDeck-Native.apk | grep "package: name='com.minddeck.nativeapp' versionCode='2' versionName='1.0.0'"
          unzip -t MindDeck-Native.apk
      - name: Verify certificate against configured native signing identity
        env:
          STORE_PASSWORD: ${{ secrets.MINDDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINDDECK_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore "$RUNNER_TEMP/minddeck-release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/native-cert.der"
          EXPECTED_CERT=$(sha256sum "$RUNNER_TEMP/native-cert.der" | cut -d ' ' -f 1)
          NATIVE_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' native-signer.txt | tr '[:upper:]' '[:lower:]')
          test -n "$NATIVE_CERT"
          test "$NATIVE_CERT" = "$EXPECTED_CERT"
          sha256sum MindDeck-Native.apk > MindDeck-Native.apk.sha256
      - name: Upload signed candidate for verification
        uses: actions/upload-artifact@v4
        with:
          name: MindDeck-Native-signed-candidate
          path: |
            MindDeck-Native.apk
            MindDeck-Native.apk.sha256
            native-signer.txt
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/minddeck-release.jks" "$RUNNER_TEMP/native-cert.der"
