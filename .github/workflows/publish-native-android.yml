name: Publish MindDeck Native APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require permanent native signing credentials
        env:
          KEYSTORE: ${{ secrets.MINDDECK_NATIVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MINDDECK_NATIVE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MINDDECK_NATIVE_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ secrets.MINDDECK_NATIVE_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_SHA256"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/minddeck-native.jks"
      - name: Build signed native release
        env:
          MINDDECK_NATIVE_KEYSTORE: ${{ runner.temp }}/minddeck-native.jks
          MINDDECK_NATIVE_STORE_PASSWORD: ${{ secrets.MINDDECK_NATIVE_STORE_PASSWORD }}
          MINDDECK_NATIVE_KEY_PASSWORD: ${{ secrets.MINDDECK_NATIVE_KEY_PASSWORD }}
        run: gradle -p native-android --no-daemon assembleRelease
      - name: Verify package and permanent certificate
        env:
          EXPECTED_SHA256: ${{ secrets.MINDDECK_NATIVE_CERT_SHA256 }}
        run: |
          APK=native-android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signer.txt
          ACTUAL_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.minddeck.nativeapp' versionCode='2' versionName='1.0.0'"
          cp "$APK" MindDeck-Native.apk
          sha256sum MindDeck-Native.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create minddeck-native-v1.0.0 MindDeck-Native.apk --target "${GITHUB_SHA}" --title "MindDeck Native 1.0.0" --notes "Premium native Android release. No WebView or browser shell. Verified across baseline, 150% font scaling, offline mode, landscape rotation, and repeated relaunch testing."
